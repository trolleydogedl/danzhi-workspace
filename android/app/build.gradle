apply plugin: "com.android.application"
android {
    namespace "cn.fudan.danzhi"
    compileSdk 34
    defaultConfig {
        applicationId "cn.fudan.danzhi"
        minSdk 26
        targetSdk 34
        versionCode 32
        versionName "1.31.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file("danzhi.keystore")
            storePassword "danzhi2026"
            keyAlias "danzhi"
            keyPassword "danzhi2026"
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix ".debug"
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds true
        enable "NewApi", "InlinedApi"
    }
    packaging {
        resources {
            excludes += ["META-INF/NOTICE.md", "META-INF/LICENSE.md"]
        }
    }
}
dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.activity:activity:1.9.2"
    implementation "com.google.zxing:core:3.5.3"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.sun.mail:android-mail:1.6.7"
    implementation "com.sun.mail:android-activation:1.6.7"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
